{% extends "appbuilder/base.html" %}

{% block content %}
<div class="container-fluid py-4">
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header">
          <h4><i class="fa fa-shopping-cart"></i> Nueva Venta</h4>
        </div>
        <div class="card-body">
          <form method="POST" action="{{ url_for('VentaView.nueva_venta') }}" id="ventaForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="row mb-4">
              <div class="col-md-6">
                <div class="form-group">
                  <label for="cliente_id">Cliente <span class="text-danger">*</span></label>
                  <select name="cliente_id" id="cliente_id" class="form-control" required>
                    <option value="">-- Seleccione un cliente --</option>
                    {% for c in clientes %}
                    <option value="{{ c.id }}">{{ c.nombre }} {{ c.apellido }} ({{ c.email }})</option>
                    {% endfor %}
                  </select>
                </div>
              </div>
              <div class="col-md-3 d-flex align-items-end">
                <a href="{{ url_for('ClienteView.add') }}" class="btn btn-outline-primary" target="_blank">
                  <i class="fa fa-plus"></i> Nuevo Cliente
                </a>
              </div>
            </div>

            <h5 class="mb-3">Productos</h5>
            <div class="table-responsive">
              <table class="table table-bordered" id="itemsTable">
                <thead class="thead-light">
                  <tr>
                    <th style="width:45%">Laptop</th>
                    <th style="width:15%">Stock</th>
                    <th style="width:15%">Precio (Bs.)</th>
                    <th style="width:15%">Cantidad</th>
                    <th style="width:10%">Subtotal</th>
                    <th style="width:5%"></th>
                  </tr>
                </thead>
                <tbody id="itemsBody">
                  <tr class="item-row">
                    <td>
                      <select name="laptop_id[]" class="form-control laptop-select" required>
                        <option value="">-- Seleccione --</option>
                        {% for l in laptops %}
                        <option value="{{ l.id }}"
                          data-precio="{{ l.precio }}"
                          data-stock="{{ l.stock }}"
                          data-nombre="{{ l.marca }} {{ l.modelo }}">
                          {{ l.marca }} {{ l.modelo }} - {{ l.procesador }} / {{ l.ram_gb }}GB / {{ l.almacenamiento_gb }}GB
                        </option>
                        {% endfor %}
                      </select>
                    </td>
                    <td class="stock-cell text-center align-middle">-</td>
                    <td class="precio-cell text-center align-middle">-</td>
                    <td>
                      <input type="number" name="cantidad[]" class="form-control cantidad-input"
                        min="1" value="1" required>
                    </td>
                    <td class="subtotal-cell text-center align-middle font-weight-bold">0.00</td>
                    <td class="text-center align-middle">
                      <button type="button" class="btn btn-sm btn-danger remove-item" disabled>
                        <i class="fa fa-times"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
                <tfoot>
                  <tr>
                    <td colspan="6">
                      <button type="button" class="btn btn-sm btn-success" id="addItem">
                        <i class="fa fa-plus"></i> Agregar otro producto
                      </button>
                    </td>
                  </tr>
                  <tr class="table-active">
                    <td colspan="4" class="text-right font-weight-bold">TOTAL</td>
                    <td class="text-center font-weight-bold" id="totalVenta">0.00</td>
                    <td></td>
                  </tr>
                </tfoot>
              </table>
            </div>

            <div class="row mt-4">
              <div class="col-md-12 text-right">
                <a href="{{ url_for('PedidoView.list') }}" class="btn btn-secondary">
                  <i class="fa fa-arrow-left"></i> Ver Pedidos
                </a>
                <button type="submit" class="btn btn-primary btn-lg">
                  <i class="fa fa-check"></i> Confirmar Venta
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block tail_js %}
{{ super() }}
<script>
(function() {
  const tbody = document.getElementById('itemsBody');
  const totalSpan = document.getElementById('totalVenta');

  function calcTotal() {
    let total = 0;
    document.querySelectorAll('.subtotal-cell').forEach(function(el) {
      total += parseFloat(el.textContent) || 0;
    });
    totalSpan.textContent = total.toFixed(2);
  }

  function updateRow(row) {
    const select = row.querySelector('.laptop-select');
    const cantInput = row.querySelector('.cantidad-input');
    const stockCell = row.querySelector('.stock-cell');
    const precioCell = row.querySelector('.precio-cell');
    const subCell = row.querySelector('.subtotal-cell');
    const removeBtn = row.querySelector('.remove-item');

    const opt = select.options[select.selectedIndex];
    if (opt && opt.value) {
      const precio = parseFloat(opt.getAttribute('data-precio'));
      const stock = parseInt(opt.getAttribute('data-stock'));
      const cantidad = parseInt(cantInput.value) || 0;
      stockCell.textContent = stock;
      precioCell.textContent = precio.toFixed(2);
      if (cantidad > stock) {
        subCell.textContent = '0.00';
        cantInput.classList.add('is-invalid');
      } else {
        subCell.textContent = (cantidad * precio).toFixed(2);
        cantInput.classList.remove('is-invalid');
      }
      removeBtn.disabled = false;
    } else {
      stockCell.textContent = '-';
      precioCell.textContent = '-';
      subCell.textContent = '0.00';
      removeBtn.disabled = true;
    }
    calcTotal();
  }

  function addRow() {
    const first = tbody.querySelector('.item-row');
    const clone = first.cloneNode(true);
    const inputs = clone.querySelectorAll('input, select');
    inputs.forEach(function(el) { el.value = ''; });
    clone.querySelector('.cantidad-input').value = '1';
    clone.querySelector('.stock-cell').textContent = '-';
    clone.querySelector('.precio-cell').textContent = '-';
    clone.querySelector('.subtotal-cell').textContent = '0.00';
    clone.querySelector('.remove-item').disabled = true;
    tbody.appendChild(clone);
    attachEvents(clone);
  }

  function attachEvents(row) {
    row.querySelector('.laptop-select').addEventListener('change', function() { updateRow(row); });
    row.querySelector('.cantidad-input').addEventListener('input', function() { updateRow(row); });
    row.querySelector('.remove-item').addEventListener('click', function() {
      if (tbody.querySelectorAll('.item-row').length > 1) {
        row.remove();
        calcTotal();
      }
    });
  }

  document.getElementById('addItem').addEventListener('click', addRow);
  attachEvents(tbody.querySelector('.item-row'));

  document.getElementById('ventaForm').addEventListener('submit', function(e) {
    let valid = true;
    document.querySelectorAll('.item-row').forEach(function(row) {
      const select = row.querySelector('.laptop-select');
      const cant = row.querySelector('.cantidad-input');
      if (!select.value) { valid = false; }
      if (!cant.value || parseInt(cant.value) < 1) { valid = false; }
      const opt = select.options[select.selectedIndex];
      if (opt && opt.value && parseInt(cant.value) > parseInt(opt.getAttribute('data-stock'))) {
        valid = false;
      }
    });
    if (!valid) {
      alert('Verifique los datos: debe seleccionar un producto para cada fila y la cantidad no debe superar el stock disponible.');
      e.preventDefault();
    }
  });
})();
</script>
{% endblock %}
